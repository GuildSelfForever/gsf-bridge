[package]
name = "gsf-bridge"
description = "GSF Bridge : application de bureau des membres de Guild Self Forever."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Nom distinct du binaire (évite le conflit de noms sous Windows, cf. modèle officiel Tauri v2).
name = "gsf_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gsf-sync = { path = "../crates/gsf-sync" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Mise à jour signée servie par le site (endpoint + token posés à l'exécution).
tauri-plugin-updater = "2"
# Ouverture du navigateur pour la connexion.
tauri-plugin-opener = "2"
# Relance après mise à jour (hors Windows, où l'installeur relance lui-même).
tauri-plugin-process = "2"
# Choix du dossier WoW.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
