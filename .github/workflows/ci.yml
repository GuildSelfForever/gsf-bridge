name: CI

# Contrôles de chaque push sur main et de chaque pull request. Aucun secret ici.
# Actions figées par empreinte de commit (le commentaire donne la version) ; Rust figé
# par rust-toolchain.toml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets-scan:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Installer gitleaks (binaire officiel, empreinte vérifiée)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Analyser les fichiers du dépôt
        # Fichiers du commit analysé (configuration : .gitleaks.toml).
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  linux-core:
    name: gsf-core + gsf-sync (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust (version de rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p gsf-core -p gsf-sync --all-targets -- -D warnings
      - name: Tests
        timeout-minutes: 20
        run: cargo test --locked -p gsf-core -p gsf-sync

  linux-app:
    name: Appli Linux (clippy)
    runs-on: ubuntu-22.04
    needs: linux-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Bibliothèques système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust (version de rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (app)
        run: cargo clippy --locked -p gsf-bridge --all-targets -- -D warnings

  windows-build:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    needs: linux-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust (version de rust-toolchain.toml)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install tauri-cli (binaire précompilé)
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: tauri-cli@2.12.4
      - name: Tests (core + sync, Windows)
        timeout-minutes: 20
        run: cargo test --locked -p gsf-core -p gsf-sync
      - name: Clippy (app)
        run: cargo clippy --locked -p gsf-bridge --all-targets -- -D warnings
      - name: Build NSIS installer (non signé pour l'updater)
        run: cargo tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gsf-bridge-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
