[workspace]
resolver = "2"
members = ["crates/gsf-core", "crates/gsf-sync", "src-tauri"]

[workspace.package]
version = "0.7.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/GuildSelfForever/gsf-bridge"
rust-version = "1.80"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
