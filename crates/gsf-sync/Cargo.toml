[package]
name = "gsf-sync"
description = "Moteur du bridge GSF (découverte WoW, surveillance, envoi, connexion, données poussées) sans dépendance Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
flate2 = "1.1.10"
gsf-core = { path = "../gsf-core" }
hex = "0.4.3"
keyring = "3.6.3"
notify-debouncer-full = "0.6.0"
rand = "0.9.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tiny_http = "0.12.0"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

# Coffre du système pour le token : Gestionnaire d'identification (Windows), trousseau (macOS),
# Secret Service (Linux : GNOME Keyring, KWallet), libdbus compilée avec le bridge (« vendored »).
[target."cfg(windows)".dependencies]
winreg = "0.56.0"
keyring = { version = "3.6.3", features = ["windows-native"] }

[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target."cfg(all(unix, not(target_os = \"macos\")))".dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
